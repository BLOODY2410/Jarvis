[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jarvis-desktop"
version = "2.0.0"
description = "Small Python-first Windows voice assistant with verified tool execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-genai>=1.0.0",
  "groq>=0.31.0",
  "pydantic>=2.12.0",
  "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
voice = [
  "keyboard>=0.13.5; platform_system == 'Windows'",
  "numpy>=2.2.0",
  "sounddevice>=0.5.0",
  "webrtcvad-wheels>=2.0.14",
]
fish = [
  "fishaudio>=0.0.5",
  "soundfile>=0.13.0",
]
windows = [
  "pillow>=11.0.0",
  "psutil>=6.1.0",
  "pycaw>=20240210",
  "pywin32>=308; platform_system == 'Windows'",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]
gui = [
  "pyinstaller>=6.12.0",
]

[project.scripts]
jarvis = "jarvis_v2.app:main"
jarvis-gui = "jarvis_v2.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_v2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_v2"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]
